services:
  fundval:
    # 使用本地源码构建（确保包含最新 main 分支功能）
    build: .
    image: fundval-live-local:latest

    # 走宿主机网络：容器内可直接访问 127.0.0.1:8045（同机 Antigravity）
    # 不改 Antigravity 对外入口，仅优化本机内网链路延迟
    network_mode: host
    volumes:
      - fundval-data:/app/backend/data
    environment:
      # AI Configuration (optional)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
      - AI_MODEL_NAME=${AI_MODEL_NAME:-gpt-3.5-turbo}

      # Email Configuration (optional)
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@fundval.live}
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "21345"]
    restart: unless-stopped

volumes:
  fundval-data:
